name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

# No production deployment job exists in this workflow on purpose — deployment is a
# separate, manual `railway up` step today (see README.md). Nothing here can push to
# production; this workflow only gates whether a change is allowed to merge.
jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_test
      JWT_SECRET: ci-test-secret-not-for-production-use

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply migrations against a real database (migration validation)
        run: npx prisma migrate deploy

      - name: Unit + integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Dependency audit (report only — see README for tracked known advisories)
        run: npm audit --audit-level=critical || true
